server:
  port: 8081

spring:
  application:
    name: healthmate-core

  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/healthmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"

# AI Engine
ai-engine:
  base-url: http://localhost:8090

# RocketMQ
rocketmq:
  name-server: localhost:9876
  producer:
    group: healthmate-producer
    send-message-timeout: 3000

# Security
security:
  aes-key: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6   # 32 hex chars = 128-bit key (生产环境从 Vault 读取)

# Logging
logging:
  level:
    com.healthmate: DEBUG
    com.healthmate.security: INFO
    org.springframework.web: INFO
