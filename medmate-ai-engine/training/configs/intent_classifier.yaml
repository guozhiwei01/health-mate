### model
model_name_or_path: D:/models/Qwen2.5-0.5B-Instruct

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,v_proj

### dataset
dataset_dir: D:/project/health-mate/medmate-ai-engine/training/data
dataset: intent_classification
