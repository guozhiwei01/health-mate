<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthMate AI - Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0f1c;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --border: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.15);
            --green: #10b981;
            --orange: #f59e0b;
            --red: #ef4444;
            --purple: #8b5cf6;
            --blue: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: var(--green);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .provider-tag {
            padding: 4px 10px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 6px;
            font-size: 11px;
            color: var(--purple);
            font-weight: 500;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .welcome-card {
            text-align: center;
            padding: 48px 24px;
            max-width: 600px;
            margin: auto;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .welcome-card h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-card p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 24px;
        }

        .quick-btn {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .quick-btn:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
            transform: translateY(-1px);
        }

        .quick-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .avatar.bot {
            background: linear-gradient(135deg, var(--accent), var(--purple));
        }

        .avatar.user {
            background: linear-gradient(135deg, var(--blue), var(--accent));
        }

        .msg-content {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
        }

        .message.user .msg-content {
            background: linear-gradient(135deg, var(--blue), var(--accent));
            border-bottom-right-radius: 4px;
        }

        .message.bot .msg-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .intent-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
        }

        .intent-tag.fast { background: rgba(6, 182, 212, 0.15); color: var(--accent); }
        .intent-tag.med { background: rgba(139, 92, 246, 0.15); color: var(--purple); }
        .intent-tag.emergency { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .intent-tag.agent { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
        .intent-tag.report { background: rgba(59, 130, 246, 0.15); color: var(--blue); }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }

        /* Input Area */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 18px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 120px;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .input-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Markdown-like rendering */
        .msg-content h3 { font-size: 15px; font-weight: 600; margin: 12px 0 6px; color: var(--accent); }
        .msg-content ul, .msg-content ol { padding-left: 20px; margin: 8px 0; }
        .msg-content li { margin: 4px 0; }
        .msg-content strong { color: var(--accent); }
        .msg-content code { background: rgba(6,182,212,0.1); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="logo">+</div>
        <h1>HealthMate AI</h1>
    </div>
    <div class="header-right">
        <div class="status-badge">
            <span class="status-dot"></span>
            Online
        </div>
        <div class="provider-tag" id="providerTag">DashScope</div>
    </div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="welcome-card" id="welcomeCard">
        <div class="welcome-icon">+</div>
        <h2>HealthMate AI Health Assistant</h2>
        <p>LangChain + LangGraph + 0.5B LoRA Intent Classifier</p>
        <p style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">
            Streaming Response via SSE | LangSmith Tracing Enabled
        </p>
        <div class="quick-actions">
            <button class="quick-btn" onclick="sendQuick(this)">
                <div class="quick-label">Symptom Consult</div>
                I have a headache for two days with nausea
            </button>
            <button class="quick-btn" onclick="sendQuick(this)">
                <div class="quick-label">Drug Consult</div>
                Can ibuprofen be taken with amoxicillin?
            </button>
            <button class="quick-btn" onclick="sendQuick(this)">
                <div class="quick-label">Health QA</div>
                How much sleep do I need per day?
            </button>
            <button class="quick-btn" onclick="sendQuick(this)">
                <div class="quick-label">Task Command</div>
                Remind me to take medicine at 8am tomorrow
            </button>
        </div>
    </div>
</div>

<div class="input-area">
    <div class="input-wrapper">
        <textarea
            class="input-field"
            id="userInput"
            placeholder="Describe your symptoms or ask a health question..."
            rows="1"
            onkeydown="handleKey(event)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            &#9654;
        </button>
    </div>
    <div class="input-hint">
        0.5B LoRA classifier routes to fast/deep/report/agent/emergency paths
    </div>
</div>

<script>
const chatContainer = document.getElementById('chatContainer');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const welcomeCard = document.getElementById('welcomeCard');
let isStreaming = false;

// Auto-resize textarea
userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function sendQuick(btn) {
    const text = btn.childNodes[2]?.textContent?.trim() || btn.innerText.split('\n').pop().trim();
    userInput.value = text;
    sendMessage();
}

function getIntentClass(model) {
    if (model?.includes('emergency')) return 'emergency';
    if (model?.includes('med')) return 'med';
    if (model?.includes('agent')) return 'agent';
    if (model?.includes('report')) return 'report';
    return 'fast';
}

function getIntentLabel(intent, model) {
    const labels = {
        casual_chat: 'Casual',
        health_qa: 'Health QA',
        symptom_consult: 'Symptom',
        drug_consult: 'Drug',
        report_parse: 'Report',
        emergency: 'Emergency',
        task_command: 'Task',
    };
    const route = model?.replace('model_', '') || '';
    return `${labels[intent] || intent} | ${route}`;
}

function appendMessage(role, content, meta = null) {
    if (welcomeCard) welcomeCard.style.display = 'none';

    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'user' ? 'U' : 'AI';

    const body = document.createElement('div');
    const msgContent = document.createElement('div');
    msgContent.className = 'msg-content';
    msgContent.innerHTML = formatContent(content);
    body.appendChild(msgContent);

    if (meta) {
        const metaDiv = document.createElement('div');
        metaDiv.className = 'msg-meta';
        const cls = getIntentClass(meta.model);
        metaDiv.innerHTML = `
            <span class="intent-tag ${cls}">${getIntentLabel(meta.intent, meta.model)}</span>
            <span>${meta.provider || ''}</span>
        `;
        body.appendChild(metaDiv);
    }

    div.appendChild(avatar);
    div.appendChild(body);
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    return msgContent;
}

function formatContent(text) {
    return text
        .replace(/### (.*)/g, '<h3>$1</h3>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
}

function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typingMsg';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'AI';

    const body = document.createElement('div');
    const msgContent = document.createElement('div');
    msgContent.className = 'msg-content';
    msgContent.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    body.appendChild(msgContent);

    div.appendChild(avatar);
    div.appendChild(body);
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function removeTyping() {
    const el = document.getElementById('typingMsg');
    if (el) el.remove();
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;
    userInput.value = '';
    userInput.style.height = 'auto';

    // User message
    appendMessage('user', text);
    showTyping();

    // SSE streaming
    try {
        const response = await fetch(`/api/chat/stream?user_input=${encodeURIComponent(text)}`, {
            method: 'POST',
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let botContent = null;
        let fullText = '';
        let meta = null;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = JSON.parse(line.slice(6));

                if (data.type === 'meta') {
                    meta = data;
                    continue;
                }

                if (data.type === 'token') {
                    if (!botContent) {
                        removeTyping();
                        botContent = appendMessage('bot', '', meta);
                    }
                    fullText += data.content;
                    botContent.innerHTML = formatContent(fullText);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }

                if (data.type === 'done' || data.type === 'error' || data.type === 'blocked') {
                    if (!botContent) {
                        removeTyping();
                        const errMsg = data.content || 'Service error, please try again.';
                        appendMessage('bot', errMsg, meta);
                    }
                }
            }
        }
    } catch (err) {
        removeTyping();
        appendMessage('bot', `Connection error: ${err.message}`);
    }

    isStreaming = false;
    sendBtn.disabled = false;
    userInput.focus();
}
</script>

</body>
</html>
